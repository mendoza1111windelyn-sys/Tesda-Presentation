services:
  - type: web
    name: tesda-presentation
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PRESENTER_PASSCODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://tesda-presenter.onrender.com,https://tesda-guests.onrender.com
  - type: web
    name: tesda-presenter
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://tesda-presentation.onrender.com
      - key: VITE_APP_ROLE
        value: presenter
      - key: VITE_GUEST_URL
        value: https://tesda-guests.onrender.com
  - type: web
    name: tesda-guests
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://tesda-presentation.onrender.com
      - key: VITE_APP_ROLE
        value: guest
